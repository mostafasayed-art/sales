<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جرد العدة</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#09253a">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f4f7;--card:#fff;--tx:#0f1f2e;--mut:#5d7083;--bd:#dde4ea;--pri:#09253a;--on:#fff;--ok:#0f7b3f;--bad:#b3261e;--bad2:#fbe9e7;--ac2:#e3edf5;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#06141f;--card:#0d2233;--tx:#e8eef4;--mut:#93a8bb;--bd:#1b3347;--pri:#5aa6d6;--on:#06141f;--ok:#4cd488;--bad:#ff8a80;--bad2:#3a1f1c;--ac2:#12334a;color-scheme:dark}}
html{overflow-x:hidden}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;font-size:15px;padding:0 0 max(40px,env(safe-area-inset-bottom))}
.top{background:#09253a;color:#e8eef4;padding:max(8px,env(safe-area-inset-top)) 12px 8px;position:sticky;top:0;z-index:5}
.top .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{height:34px;width:auto}.ttl{font-weight:700;font-size:16px;flex:1}
.top #role{color:#9fb6c9;font-size:12px}
.top button{width:auto;padding:4px 12px;font-size:13px;background:transparent;color:#e8eef4;border:1px solid #3a5873}
#app{max-width:1100px;margin:0 auto;padding:12px}
h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:8px}.gr .card{margin:0}.gr .m{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center}.row .n{flex:1;min-width:0}.row .n b{display:block;overflow-wrap:anywhere;font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.bar>*{flex:1;min-width:120px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;width:100%}
button{cursor:pointer;background:var(--pri);color:var(--on);border:0;font-weight:600}button.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}button.x{background:none;color:var(--bad);width:auto;padding:4px 8px}
.btn{display:block;text-align:center;padding:9px;border:1px solid var(--bd);border-radius:10px;cursor:pointer;margin-top:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tabs button{width:auto;white-space:nowrap;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.cats{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}.cats button{width:auto;white-space:nowrap;padding:6px 12px;background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:500}.cats button.on{background:var(--ac2);color:var(--pri);border-color:var(--pri)}
.mut,small{color:var(--mut);font-size:12px}
.q{width:84px;text-align:center;font-size:17px;font-weight:700;direction:ltr}
.th{width:52px;height:52px;border-radius:8px;background:var(--ac2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;font-size:20px}.th img{width:100%;height:100%;object-fit:cover}
.pg{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0 10px}.pg i{display:block;height:100%;background:var(--pri)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.sum div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center}.sum b{display:block;font-size:20px}
.neg{color:var(--bad)}.pos{color:var(--ok)}.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:center}th{color:var(--mut);font-size:12px}td:first-child,th:first-child{text-align:right;min-width:150px}tr.bad td{background:var(--bad2)}
.m{padding:30px 10px;text-align:center;color:var(--mut)}
.zm{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:9}.zm img{max-width:94%;max-height:90%;border-radius:10px}
.up{color:var(--pri);font-size:12px;cursor:pointer;display:inline-block;margin-inline-end:10px}
.bd2{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;background:var(--ac2)}.bd2.ok{color:var(--ok)}.bd2.no{color:var(--bad)}
.ev{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--bd);font-size:14px}.ev:last-child{border:0}.ev time{color:var(--mut);font-size:12px;min-width:92px}
.st{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--pri);color:var(--on);padding:6px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}.st.on{opacity:1}
.hid{position:fixed;top:0;right:0;width:1px;height:1px;opacity:0;overflow:hidden}
</style>
</head>

auth.onAuthStateChanged(async u=>{
 unsubs.forEach(f=>f());unsubs=[];
 $('#out').style.display=u?'':'none';
 if(!u){me=null;login();return}
 try{
  let s=await db.doc('inv_users/'+u.uid).get();

   const o=await db.doc('users/'+u.uid).get().catch(()=>null);
   if(o&&o.exists&&o.data().role==='admin'){await db.doc('inv_users/'+u.uid).set({name:o.data().name||'',email:o.data().email||u.email||'',role:'admin',branch:''});s=await db.doc('inv_users/'+u.uid).get()}

function calc(B){
 const pm=prevM(month),R=[],ex=exps.filter(e=>e.m===month);
 items.forEach(it=>{
  let op=0,iss=0,tr=0,act=0,diff=0,has=false,cmp=false;
  B.forEach(b=>{
   const c=(counts[key(month,b)]||{}).q||{},p=(counts[key(pm,b)]||{}).q||{};
   let s=0,t=0;
   ex.forEach(e=>{if(e.i!==it.id)return;if(e.ty==='tr'){if(e.to===b)t+=e.q;if(e.b===b)t-=e.q}else if(e.b===b)s+=e.q});
   iss+=s;tr+=t;
   if(c[it.id]!==undefined){has=true;act+=c[it.id]}
   if(p[it.id]!==undefined)op+=p[it.id];
   if(c[it.id]!==undefined&&p[it.id]!==undefined){cmp=true;diff+=c[it.id]-(p[it.id]+s+t)}
  });
  if(has||iss||tr||op)R.push({it,op,iss,tr,act,diff:cmp?diff:null,has});
 });
 return R;
}

function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return Math.abs(h).toString(36)}
function parseWB(wb){

  const h=rows[0].map(x=>String(x).trim().toLowerCase()),f=rx=>h.findIndex(x=>rx.test(x));
  const d=f(/desc/);let c=f(/^code$/);if(c<0)c=f(/^details?$/);const a=f(/^(name|guid)/);
  if(d<0)return;
  rows.slice(1).forEach(r=>{

 const used=new Set(),ids=new Set(),list=[];let add=0,upd=0;
 P.forEach(p=>{
  const m=(p.code&&byC.get(p.code))||byN.get(nm(p.cat)+'|'+nm(p.name));
  if(m&&!used.has(m.id)){used.add(m.id);ids.add(m.id);upd++;list.push({...m,name:p.name,ar:p.ar||m.ar||'',code:p.code||m.code||'',cat:p.cat})}

 });
 const keep=replace?[]:items.filter(i=>!used.has(i.id));
 return{list:[...list,...keep],add,upd,gone:replace?items.length-used.size:0};
}
$('#fx').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 try{
  await loadX();const P=parseWB(XLSX.read(await f.arrayBuffer()));
  if(!P.length)throw new Error('مفيش أصناف في الملف. لازم يكون فيه عمود اسمه Description');
  const rp=!!($('#rpl')&&$('#rpl').checked),r=mergeItems(P,rp);
  if(!confirm('في الملف '+P.length+' صنف.\nجديد: '+r.add+' — هيتحدّث: '+r.upd+(rp?' — هيتمسح: '+r.gone:'')+'\nتكمّل؟'))return;
  await db.doc('inv_cfg/items').set({list:r.list});flash();alert('تم تحديث قايمة الأصناف ✅');
 }catch(x){err(x)}
};
$('#fs').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 try{
  const d=JSON.parse(await f.text());if(!d.items)throw new Error('الملف مش صحيح');
  if(!confirm('استبدال القايمة بـ '+d.items.length+' صنف؟'))return;
  await db.doc('inv_cfg/items').set({list:d.items});alert('تم ✅');
 }catch(x){err(x)}
};

/* ===== الإعدادات ===== */
const saveBranches=l=>db.doc('inv_cfg/branches').set({list:l}).then(flash).catch(err);
function addBranch(){const n=$('#bn').value.trim();if(!n)return;saveBranches([...branches,{id:'b'+Date.now().toString(36),name:n}])}
async function copyBranches(auto){
 try{
  const d=await db.doc('config/main').get(),l=(d.data()||{}).branches||[];
  if(!l.length){if(!auto)alert('مفيش فروع في المبيعات');return}
  if(!auto&&!confirm('استبدال فروع الجرد بـ '+l.length+' فرع من المبيعات؟'))return;
  await db.doc('inv_cfg/branches').set({list:l.map(b=>({id:b.id,name:b.name}))});flash();
 }catch(e){if(!auto)err(e)}
}
async function copyUsers(){
 try{
  const s=await db.collection('users').get(),b=db.batch();let n=0;
  s.docs.forEach(d=>{if(d.id===me.uid)return;const x=d.data();b.set(db.doc('inv_users/'+d.id),{name:x.name||'',email:x.email||'',role:x.role||'user',branch:x.branch||''});n++});
  await b.commit();alert('اتنسخ '+n+' يوزر ✅');
 }catch(e){err(e)}
}
function vBranches(){
 return'<div class="card"><h2>الفروع</h2>'+(branches.map(b=>'<div class="row" style="margin-bottom:6px"><input data-bn="'+b.id+'" value="'+esc(b.name)+'"><button class="x" data-bdel="'+b.id+'">حذف</button></div>').join('')||'<div class="mut">مفيش فروع لسه</div>')+'<div class="bar" style="margin-top:8px"><input id="bn" placeholder="اسم فرع جديد"><button id="addBr">إضافة فرع</button></div></div>'
 +'<div class="card"><b>نقل من تطبيق المبيعات (مرة واحدة)</b><div class="mut">بينسخ الفروع واليوزرز الحالية للجرد، وبعدها بقوا مستقلين تمامًا عن المبيعات.</div><div class="bar" style="margin-top:6px"><button class="s" id="cpB">نسخ الفروع</button><button class="s" id="cpU">نسخ اليوزرز</button></div></div>';
}
function vUsers(){
 const bo=s=>'<option value="">— اختار فرع —</option>'+branches.map(b=>'<option value="'+b.id+'"'+(b.id===s?' selected':'')+'>'+esc(b.name)+'</option>').join('');
 return'<div class="card"><h2>المستخدمين</h2>'+users.map(u=>'<div class="card" style="margin:6px 0"><div class="row"><div class="n"><b>'+esc(u.name)+(u.role==='admin'?' (أدمن)':'')+'</b><small>'+esc(u.email)+'</small></div>'+(u.id===me.uid?'':'<button class="x" data-ud="'+u.id+'">إيقاف</button>')+'</div>'+(u.role==='admin'?'':'<select data-ub="'+u.id+'" style="margin-top:6px">'+bo(u.branch)+'</select>')+'<button class="s" data-ur="'+esc(u.email)+'" style="margin-top:6px">إرسال لينك تغيير الباسورد</button></div>').join('')
 +'<b style="display:block;margin-top:10px">مستخدم جديد</b><div class="bar" style="margin-top:6px"><input id="un" placeholder="الاسم"><input id="ue" type="email" placeholder="الإيميل"><input id="up" placeholder="الباسورد (6 أحرف على الأقل)"><select id="ur"><option value="user">يوزر فرع</option><option value="admin">أدمن</option></select><select id="ub">'+bo('')+'</select></div><button id="addU">إنشاء الحساب</button></div>';
}
async function addU(){
 const name=$('#un').value.trim(),email=$('#ue').value.trim(),pw=$('#up').value,role=$('#ur').value,br=$('#ub').value;
 if(!name||!email||pw.length<6){alert('اكمل الاسم والإيميل وباسورد 6 أحرف على الأقل');return}
 if(role==='user'&&!br){alert('اختار فرع لليوزر');return}
 try{
  const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FIREBASE_CONFIG,'sec');
  const c=await sec.auth().createUserWithEmailAndPassword(email,pw);
  await db.doc('inv_users/'+c.user.uid).set({name,email,role,branch:role==='user'?br:''});
  await sec.auth().signOut();alert('تم إنشاء الحساب ✅ ابعت للشخص الإيميل والباسورد');
  ['un','ue','up'].forEach(i=>$('#'+i).value='');
 }catch(e){err(e)}
}
function vSet(){
 return vBranches()+vUsers()
 +'<div class="card"><b>تحديث الأصناف من Excel</b><div class="mut">أي ملف Excel: كل شيت قسم، وفيه أعمدة Description و Code و Name (بالعربي). الأصناف المتطابقة (بالكود أو الاسم) بتتحدّث بنفس الجرد، والجديدة بتتضاف.</div><label class="ck" style="display:flex;gap:8px;align-items:center;margin:8px 0"><input type="checkbox" id="rpl" style="width:auto"> استبدال القايمة (يمسح الأصناف اللي مش في الملف)</label><label class="btn" for="fx">اختار ملف Excel</label></div>'
 +'<div class="card"><b>ملف الأصناف الجاهز</b><div class="mut">لو بعتلك ملف inventory-seed.json.</div><label class="btn" for="fs">اختار الملف</label></div>'
 +'<div class="card"><b>صنف جديد</b><div class="bar" style="margin-top:8px"><input id="ic" list="cl" placeholder="القسم"><datalist id="cl">'+cats().map(c=>'<option value="'+esc(c)+'">').join('')+'</datalist><input id="in" placeholder="اسم الصنف"><input id="ik" placeholder="الكود (اختياري)"></div><button id="addIt">إضافة صنف</button></div>'
 +'<div class="mut">عدد الأصناف: '+items.length+'</div>';
}
function addIt(){
 const c=$('#ic').value.trim(),n=$('#in').value.trim(),k=$('#ik').value.trim();
 if(!c||!n){alert('القسم والاسم مطلوبين');return}
 db.doc('inv_cfg/items').set({list:[...items,{id:'n'+Date.now().toString(36),cat:c,code:k,name:n}]}).then(()=>{flash();['ic','in','ik'].forEach(i=>$('#'+i).value='')}).catch(err);
}
async function shrink(f){const b=await createImageBitmap(f),s=Math.min(1,180/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.72)}
$('#fi').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!upId)return;try{const d=await shrink(f);await db.doc('inv_imgs/u').set({[upId]:d},{merge:true});flash()}catch(x){err(x)}};
</script>
