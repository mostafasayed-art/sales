<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09253C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ovio Sales</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09253C;--card:#0f3350;--card2:#0b2d47;--bd:#1f4c6e;--tx:#eaeef4;--mut:#8fa8bd;--pri:#eaeef4;--on:#09253C;--ok:#5fd3a6;--bad:#ff8f8f;--warn:#f2c46d;--acc:#7fb4d9;--gold:#f2c46d;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;font-size:15px;max-width:960px;margin-inline:auto;padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
.top img{height:46px;width:auto;display:block}
.top .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}.tabs button{flex:0 0 auto}
button,select,input{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
input,select{width:100%}
input::placeholder{color:var(--mut)}
.f{flex:1 1 120px}.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
button{cursor:pointer}button.p,.tabs button.on{background:var(--pri);color:var(--on);border-color:var(--pri);font-weight:700}
.sm{padding:4px 8px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 0;border-bottom:1px dashed var(--bd)}.kv:last-child{border:0}
.mut{color:var(--mut);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--acc)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:13px}
th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--bd)}th{background:var(--card2)}tfoot td{font-weight:700}
.login{max-width:380px;margin:6vh auto 0;text-align:center}.login img{height:90px;margin-bottom:10px}.login .f{text-align:start}
.chart{direction:ltr}.chart svg{width:100%;height:auto;display:block}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:4px;vertical-align:middle}
.br{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.trk{position:relative;height:14px;background:var(--bd);border-radius:7px}.trk .fl{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:7px}.trk .pj{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--gold);border-radius:2px}
.stk{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--bd);margin:8px 0}
</style>
</head>
<body>
<div class="top"><img src="logo.png" alt="Ovio"><div class="who"><span id="role"></span><button class="sm" id="out" style="display:none" onclick="auth.signOut()">خروج</button></div></div>
<div id="app" class="mut">جاري التحميل…</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== الصق إعدادات مشروع Firebase هنا =====
const FIREBASE_CONFIG={apiKey:"AIzaSyBAt_e-2Jrrnp6wZMm_WgxnVaR0fJikelc",authDomain:"ovio-sales.firebaseapp.com",projectId:"ovio-sales",appId:"1:798015614049:web:70dcac4aca12f734808e20"};
// ==========================================
const $=s=>document.querySelector(s);
const N=(x,d=0)=>Number(x||0).toLocaleString('en-US',{maximumFractionDigits:d});
const P=x=>isFinite(x)?N(x,1)+'%':'—';
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const today=()=>{const d=new Date();return ym(d)+'-'+String(d.getDate()).padStart(2,'0')};
firebase.initializeApp(FIREBASE_CONFIG);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
const auth=firebase.auth(),db=firebase.firestore();
let me=null,isAdmin=false,cfg={branches:[],targets:{}},rows=[],users=[],month=ym(new Date()),tab='sum',fb='all',unsubs=[],unsubS;
const AR={'auth/invalid-credential':'الإيميل أو الباسورد غلط','auth/wrong-password':'الباسورد غلط','auth/user-not-found':'الحساب غير موجود','auth/email-already-in-use':'الإيميل مستخدم قبل كده','auth/weak-password':'الباسورد ضعيف (6 أحرف على الأقل)','auth/too-many-requests':'محاولات كتير، جرّب بعد شوية'};
const err=e=>alert(AR[e.code]||('حصل خطأ: '+(e.message||e)));

auth.onAuthStateChanged(async u=>{
  unsubs.forEach(f=>f());unsubs=[];if(unsubS)unsubS();
  $('#out').style.display=u?'':'none';
  if(!u){me=null;login();return}
  try{
    const s=await db.doc('users/'+u.uid).get();
    if(!s.exists){$('#app').innerHTML='<div class="card">حسابك مش متفعّل. كلم الأدمن.</div>';return}
    me={uid:u.uid,...s.data()};isAdmin=me.role==='admin';tab=isAdmin?'tot':'entry';
    $('#role').textContent=isAdmin?'(أدمن)':'(يوزر)';
    unsubs.push(db.doc('config/main').onSnapshot(d=>{if(d.exists)cfg=Object.assign({branches:[],targets:{}},d.data());render()}));
    if(isAdmin)unsubs.push(db.collection('users').onSnapshot(q=>{users=q.docs.map(d=>({uid:d.id,...d.data()}));if(tab==='set')render()}));
    sub();
  }catch(e){$('#app').textContent='تعذر التحميل: '+e.message}
});
function login(){
  $('#role').textContent='';
  $('#app').innerHTML=`<div class="card login"><img src="logo.png" alt="Ovio"><h2>تسجيل الدخول</h2>
  <div class="f"><label>الإيميل</label><input id="le" type="email" autocomplete="username"></div>
  <div class="f" style="margin-top:8px"><label>الباسورد</label><input id="lp" type="password" autocomplete="current-password"></div>
  <div class="row" style="margin-top:12px;justify-content:center"><button class="p" onclick="doLogin()">دخول</button><button class="sm" onclick="forgot()">نسيت الباسورد</button></div></div>`;
}
const doLogin=()=>auth.signInWithEmailAndPassword($('#le').value.trim(),$('#lp').value).catch(err);
const forgot=()=>{const e=$('#le').value.trim();if(!e){alert('اكتب الإيميل الأول');return}auth.sendPasswordResetEmail(e).then(()=>alert('اتبعتلك لينك تغيير الباسورد على الإيميل')).catch(err)};
function sub(){if(unsubS)unsubS();unsubS=db.collection('sales').where('month','==',month).onSnapshot(s=>{rows=s.docs.map(d=>d.data());render()},e=>{$('#app').textContent='تعذر قراءة المبيعات'})}
const saveCfg=()=>db.doc('config/main').set(cfg).catch(err);
const bName=id=>(cfg.branches.find(b=>b.id===id)||{name:'؟'}).name;
const dim=()=>{const[y,m]=month.split('-').map(Number);return new Date(y,m,0).getDate()};
const tgt=b=>{const t=cfg.targets[month]||{};return b==='all'?cfg.branches.reduce((a,x)=>a+(+t[x.id]||0),0):(+t[b]||0)};
const CH=['dine','take','del','cat'],CL={dine:'Dine in',take:'Take away',del:'Delivery',cat:'Catering'};
function calc(b){
  const r=rows.filter(x=>b==='all'||x.branch===b),D=dim(),T=tgt(b),by={};
  const ch={};CH.forEach(k=>ch[k]={s:0,n:0});
  r.forEach(x=>{const d=+x.date.slice(8);(by[d]=by[d]||{s:0,i:0,n:0});by[d].s+=x.sales;by[d].i+=x.invoices;CH.forEach(k=>{if(x[k]){ch[k].s+=x[k].s||0;ch[k].n+=x[k].n||0}})});
  const days=Object.keys(by).map(Number),last=days.length?Math.max(...days):0;
  let S=0,I=0;days.forEach(d=>{S+=by[d].s;I+=by[d].i});
  const avg=last?S/last:0,proj=avg*D;
  return{by,last,S,I,T,D,avg,proj,pct:T?S/T*100:NaN,pp:T?proj/T*100:NaN,ticket:I?S/I:0,ch}
}
const cls=p=>!isFinite(p)?'':p>=100?'ok':p>=80?'warn':'bad';
function card(name,c){
  const w=Math.min(100,isFinite(c.pct)?c.pct:0);
  return `<div class="card"><h2>${name}</h2>
  <div class="kv"><span>المبيعات حتى الآن</span><b>${N(c.S)}</b></div>
  <div class="kv"><span>التارجت الشهري</span><b>${c.T?N(c.T):'—'}</b></div>
  <div class="kv"><span>المحقق من التارجت</span><b class="${cls(c.pct)}">${P(c.pct)}</b></div>
  <div class="bar"><i style="width:${w}%"></i></div>
  <div class="kv"><span>عدد الفواتير</span><b>${N(c.I)}</b></div>
  <div class="kv"><span>متوسط الفاتورة</span><b>${N(c.ticket,1)}</b></div>
  ${CH.map(k=>`<div class="kv"><span>${CL[k]}</span><span>${N(c.ch[k].s)} <span class="mut">(${c.S?N(c.ch[k].s/c.S*100,1):0}%) · ${N(c.ch[k].n)} فاتورة</span></span></div>`).join('')}
  <div class="kv"><span>متوسط المبيعات اليومي</span><b>${N(c.avg)}</b></div>
  <div class="kv"><span>🔮 المتوقع آخر الشهر</span><b>${N(c.proj)}</b></div>
  <div class="kv"><span>المتوقع من التارجت</span><b class="${cls(c.pp)}">${P(c.pp)}</b></div>
  <div class="kv"><span>${c.proj>=c.T?'زيادة متوقعة':'عجز متوقع'}</span><b class="${c.proj>=c.T?'ok':'bad'}">${c.T?N(Math.abs(c.proj-c.T)):'—'}</b></div></div>`
}

const K=n=>{n=Math.abs(n)>=1e6?N(n/1e6,1)+'M':Math.abs(n)>=1e3?N(n/1e3,1)+'K':N(n);return n};
function chartDaily(c){
  const W=640,H=230,L=44,R=10,T=14,B=26,D=c.D,dt=c.T?c.T/D:0;
  let mx=dt;for(let d=1;d<=D;d++)mx=Math.max(mx,(c.by[d]||{s:0}).s);mx=(mx||1)*1.15;
  const x=d=>L+(d-.5)*(W-L-R)/D,y=v=>T+(H-T-B)*(1-v/mx),bw=Math.max(2,(W-L-R)/D*.62);
  let g='';for(let i=0;i<=3;i++){const v=mx*i/3;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#1f4c6e" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#8fa8bd">${K(v)}</text>`}
  let bars='';for(let d=1;d<=D;d++){const v=(c.by[d]||{s:0}).s;if(v>0)bars+=`<rect x="${x(d)-bw/2}" y="${y(v)}" width="${bw}" height="${H-B-y(v)}" rx="2" fill="${dt&&v<dt?'#7fb4d9':'#5fd3a6'}"/>`}
  let xt='';for(let d=1;d<=D;d++)if(d===1||d%5===0||d===D)xt+=`<text x="${x(d)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#8fa8bd">${d}</text>`;
  const tl=dt?`<line x1="${L}" x2="${W-R}" y1="${y(dt)}" y2="${y(dt)}" stroke="#f2c46d" stroke-width="2" stroke-dasharray="6 4"/>`:'';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}${bars}${tl}${xt}</svg></div><div class="lg"><span><i style="background:#5fd3a6"></i>أعلى من تارجت اليوم</span><span><i style="background:#7fb4d9"></i>أقل من التارجت</span><span><i style="background:#f2c46d"></i>تارجت اليوم</span></div>`
}
function chartCum(c){
  const W=640,H=230,L=44,R=10,T=14,B=26,D=c.D,mx=(Math.max(c.T,c.proj,c.S)||1)*1.1;
  const x=d=>L+(d-1)*(W-L-R)/Math.max(D-1,1),y=v=>T+(H-T-B)*(1-v/mx);
  let g='';for(let i=0;i<=3;i++){const v=mx*i/3;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#1f4c6e"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#8fa8bd">${K(v)}</text>`}
  let pts=[],cs=0;for(let d=1;d<=c.last;d++){cs+=(c.by[d]||{s:0}).s;pts.push(`${x(d)},${y(cs)}`)}
  let xt='';for(let d=1;d<=D;d++)if(d===1||d%5===0||d===D)xt+=`<text x="${x(d)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#8fa8bd">${d}</text>`;
  const tl=c.T?`<line x1="${x(1)}" y1="${y(c.T/D)}" x2="${x(D)}" y2="${y(c.T)}" stroke="#f2c46d" stroke-width="2" stroke-dasharray="6 4"/>`:'';
  const pj=c.last&&c.last<D?`<line x1="${x(c.last)}" y1="${y(c.S)}" x2="${x(D)}" y2="${y(c.proj)}" stroke="#eaeef4" stroke-width="2" stroke-dasharray="2 4"/><circle cx="${x(D)}" cy="${y(c.proj)}" r="4" fill="#eaeef4"/>`:'';
  const ac=pts.length?`<polyline points="${pts.join(' ')}" fill="none" stroke="#5fd3a6" stroke-width="3" stroke-linejoin="round"/>`:'';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}${tl}${ac}${pj}${xt}</svg></div><div class="lg"><span><i style="background:#5fd3a6"></i>الفعلي التراكمي</span><span><i style="background:#f2c46d"></i>التارجت التراكمي</span><span><i style="background:#eaeef4"></i>التوقع لآخر الشهر</span></div>`
}
function chartBranches(){
  const rows=cfg.branches.map(b=>({n:b.name,c:calc(b.id)}));
  if(!rows.length)return '<span class="mut">أضف فروع</span>';
  const mx=Math.max(130,...rows.map(r=>Math.max(isFinite(r.c.pct)?r.c.pct:0,isFinite(r.c.pp)?r.c.pp:0)))*1.02;
  return rows.map(r=>{const a=isFinite(r.c.pct)?r.c.pct:0,p=isFinite(r.c.pp)?r.c.pp:0;
    return `<div class="br"><span>${r.n}</span><div><div class="trk"><div class="fl" style="width:${Math.min(a/mx*100,100)}%"></div>${r.c.T?`<div class="pj" style="left:${Math.min(p/mx*100,100)}%"></div>`:''}</div><div class="mut" style="margin-top:3px">المحقق ${P(r.c.pct)} · المتوقع <span class="${cls(r.c.pp)}">${P(r.c.pp)}</span> · ${N(r.c.S)}</div></div></div>`}).join('')+`<div class="lg"><span><i style="background:#7fb4d9"></i>المحقق حتى الآن</span><span><i style="background:#f2c46d"></i>المتوقع آخر الشهر</span></div>`
}
function chartChannels(c){
  const col={dine:'#7fb4d9',take:'#5fd3a6',del:'#f2c46d',cat:'#c9a7ff'},tot=CH.reduce((a,k)=>a+c.ch[k].s,0);
  if(!tot)return '<span class="mut">لا توجد بيانات قنوات بعد</span>';
  return `<div class="stk">${CH.map(k=>`<div style="width:${c.ch[k].s/tot*100}%;background:${col[k]}"></div>`).join('')}</div>`+CH.map(k=>`<div class="kv"><span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${col[k]};margin-inline-end:6px"></i>${CL[k]}</span><span>${N(c.ch[k].s)} <span class="mut">(${N(c.ch[k].s/tot*100,1)}%) · ${N(c.ch[k].n)} فاتورة</span></span></div>`).join('')
}
function total(){
  const c=calc('all');
  return `<div class="grid">${card('إجمالي كل الفروع',c)}<div class="card"><h2>مبيعات كل يوم مقابل التارجت</h2>${chartDaily(c)}</div></div>
  <div class="card"><h2>التراكمي مقابل التارجت والتوقع</h2>${chartCum(c)}</div>
  <div class="grid"><div class="card"><h2>المحقق والمتوقع لكل فرع</h2>${chartBranches()}</div><div class="card"><h2>توزيع المبيعات حسب القناة</h2>${chartChannels(c)}</div></div>`
}
const summary=()=>`<div class="grid">${cfg.branches.map(b=>card(b.name,calc(b.id))).join('')||'<div class="card">أضف الفروع من الإعدادات</div>'}</div>`;
function daily(b){
  const c=calc(b),dt=c.T/c.D;let cs=0,ct=0,h='';
  for(let d=1;d<=c.last;d++){
    const x=c.by[d]||{s:0,i:0};cs+=x.s;ct+=dt;
    const df=x.s-dt,pp=dt?x.s/dt*100:NaN,cp=ct?cs/ct*100:NaN;
    h+=`<tr><td>${d}</td><td>${N(x.s)}</td><td>${N(x.i)}</td><td>${N(x.i?x.s/x.i:0,1)}</td><td>${c.T?N(dt):'—'}</td><td class="${df>=0?'ok':'bad'}">${c.T?N(df):'—'}</td><td class="${cls(pp)}">${P(pp)}</td><td>${N(cs)}</td><td>${c.T?N(ct):'—'}</td><td class="${cls(cp)}">${P(cp)}</td></tr>`
  }
  return `<div class="card sc"><table><thead><tr><th>اليوم</th><th>المبيعات</th><th>الفواتير</th><th>متوسط الفاتورة</th><th>تارجت اليوم</th><th>الفرق</th><th>% اليوم</th><th>تراكمي</th><th>تارجت تراكمي</th><th>% تراكمي</th></tr></thead><tbody>${h||'<tr><td colspan="10">لا توجد بيانات</td></tr>'}</tbody><tfoot><tr><td>الإجمالي</td><td>${N(c.S)}</td><td>${N(c.I)}</td><td>${N(c.ticket,1)}</td><td colspan="3"></td><td>${N(c.S)}</td><td>${c.T?N(dt*c.last):'—'}</td><td class="${cls(c.pct)}">${P(c.S&&dt?c.S/(dt*c.last)*100:NaN)}</td></tr></tfoot></table></div>`
}
function entry(){
  const bs=isAdmin?cfg.branches:cfg.branches.filter(b=>b.id===me.branch);
  if(!bs.length)return `<div class="card">${isAdmin?'ابدأ بإضافة الفروع من تبويب الإعدادات.':'حسابك مش مربوط بفرع. كلم الأدمن.'}</div>`;
  return `<div class="card"><h2>إدخال مبيعات يوم</h2><div class="row">
  <div class="f"><label>الفرع</label><select id="eb">${bs.map(b=>`<option value="${b.id}">${b.name}</option>`).join('')}</select></div>
  <div class="f"><label>التاريخ</label><input id="ed" type="date" value="${today()}"></div></div>
  ${CH.map(k=>`<div class="row" style="margin-top:10px"><b style="flex:1 1 100%">${CL[k]}</b>
  <div class="f"><label>المبيعات</label><input id="s_${k}" type="number" inputmode="decimal" oninput="av()"></div>
  <div class="f"><label>عدد الفواتير</label><input id="n_${k}" type="number" inputmode="numeric" oninput="av()"></div></div>`).join('')}
  <div class="kv" style="margin-top:10px"><span>إجمالي المبيعات</span><b id="et">0</b></div>
  <div class="kv"><span>إجمالي الفواتير</span><b id="en">0</b></div>
  <div class="kv"><span>متوسط الفاتورة</span><b id="ea">—</b></div>
  <p class="mut">إدخال نفس اليوم تاني بيعدّل القديم.</p>
  <button class="p" onclick="saveE()">حفظ</button></div>${isAdmin?'':daily(me.branch)+card('أداء فرعي',calc(me.branch))}`
}
function av(){let S=0,Nn=0;CH.forEach(k=>{S+=+$('#s_'+k).value||0;Nn+=+$('#n_'+k).value||0});
  $('#et').textContent=N(S);$('#en').textContent=N(Nn);$('#ea').textContent=Nn?N(S/Nn,1):'—'}
async function saveE(){
  const b=$('#eb').value,d=$('#ed').value,v={};let S=0,Nn=0;
  CH.forEach(k=>{const s=+$('#s_'+k).value||0,n=+$('#n_'+k).value||0;v[k]={s,n};S+=s;Nn+=n});
  if(!b||!d||S<=0||!(Nn>0)){alert('اكتب المبيعات وعدد الفواتير');return}
  try{await db.doc('sales/'+b+'_'+d).set({branch:b,date:d,month:d.slice(0,7),sales:S,invoices:Nn,...v,by:me.uid});
    if(d.slice(0,7)!==month){month=d.slice(0,7);sub()}
    CH.forEach(k=>{$('#s_'+k).value='';$('#n_'+k).value=''});av();alert('تم الحفظ ✅')}catch(e){err(e)}
}
function settings(){
  const t=cfg.targets[month]||{},bo=cfg.branches.map(b=>`<option value="${b.id}">${b.name}</option>`).join('');
  return `<div class="card"><h2>الفروع</h2><div class="row"><input id="nb" placeholder="اسم فرع جديد" style="flex:1"><button class="p" onclick="addB()">إضافة</button></div>
  ${cfg.branches.map(b=>`<div class="kv"><span>${b.name}</span><button class="sm" onclick="delB('${b.id}')">حذف</button></div>`).join('')}</div>
  <div class="card"><h2>التارجت الشهري (${month})</h2>
  ${cfg.branches.map(b=>`<div class="row" style="margin-bottom:6px"><span style="flex:1">${b.name}</span><input type="number" inputmode="decimal" style="width:140px" value="${t[b.id]||''}" onchange="setT('${b.id}',this.value)"></div>`).join('')||'<span class="mut">أضف فروع الأول</span>'}
  <p class="mut">الإجمالي: <b>${N(tgt('all'))}</b></p></div>
  <div class="card"><h2>إنشاء حساب جديد</h2>
  <div class="row"><div class="f"><label>الاسم</label><input id="un"></div><div class="f"><label>الإيميل</label><input id="ue" type="email"></div></div>
  <div class="row" style="margin-top:6px"><div class="f"><label>الباسورد (6+ أحرف)</label><input id="up" type="text"></div>
  <div class="f"><label>الصلاحية</label><select id="ur"><option value="user">يوزر</option><option value="admin">أدمن</option></select></div>
  <div class="f"><label>الفرع (لليوزر)</label><select id="ub"><option value="">—</option>${bo}</select></div></div>
  <button class="p" style="margin-top:8px" onclick="addU()">إنشاء الحساب</button></div>
  <div class="card"><h2>الحسابات</h2>${users.map(u=>`<div class="kv" style="flex-wrap:wrap"><span>${u.name||''}<br><span class="mut">${u.email||''}</span></span>
  <span class="row"><select style="width:90px" onchange="updU('${u.uid}',{role:this.value})"><option value="user" ${u.role==='user'?'selected':''}>يوزر</option><option value="admin" ${u.role==='admin'?'selected':''}>أدمن</option></select>
  <select style="width:110px" onchange="updU('${u.uid}',{branch:this.value})"><option value="">—</option>${cfg.branches.map(b=>`<option value="${b.id}" ${u.branch===b.id?'selected':''}>${b.name}</option>`).join('')}</select>
  <button class="sm" onclick="resetU('${u.email}')">باسورد</button><button class="sm" onclick="delU('${u.uid}')">إيقاف</button></span></div>`).join('')||'<span class="mut">لا يوجد</span>'}</div>`
}
function addB(){const n=$('#nb').value.trim();if(!n)return;cfg.branches.push({id:'b'+Date.now(),name:n});saveCfg()}
function delB(id){if(!confirm('حذف الفرع؟ (البيانات القديمة هتفضل محفوظة)'))return;cfg.branches=cfg.branches.filter(b=>b.id!==id);saveCfg()}
function setT(id,v){(cfg.targets[month]=cfg.targets[month]||{})[id]=+v;saveCfg()}
async function addU(){
  const name=$('#un').value.trim(),email=$('#ue').value.trim(),pw=$('#up').value,role=$('#ur').value,branch=$('#ub').value;
  if(!name||!email||pw.length<6){alert('اكمل الاسم والإيميل وباسورد 6 أحرف على الأقل');return}
  if(role==='user'&&!branch){alert('اختار فرع لليوزر');return}
  let sec;
  try{
    sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FIREBASE_CONFIG,'sec');
    const c=await sec.auth().createUserWithEmailAndPassword(email,pw);
    await db.doc('users/'+c.user.uid).set({name,email,role,branch:role==='user'?branch:''});
    await sec.auth().signOut();alert('تم إنشاء الحساب ✅ ابعت للشخص الإيميل والباسورد');
    ['un','ue','up'].forEach(i=>$('#'+i).value='')
  }catch(e){err(e)}
}
const updU=(id,d)=>db.doc('users/'+id).update(d).catch(err);
const resetU=e=>auth.sendPasswordResetEmail(e).then(()=>alert('اتبعت لينك تغيير الباسورد')).catch(err);
function delU(id){if(id===me.uid){alert('مينفعش توقف حسابك');return}if(confirm('إيقاف الحساب؟'))db.doc('users/'+id).delete().catch(err)}

function render(){
  if(!me)return;
  if(document.activeElement&&/^(s_|n_|nb|un|ue|up|ei)/.test(document.activeElement.id))return;
  const T=isAdmin?[['tot','الإجمالي'],['sum','الفروع'],['day','يوم بيوم'],['entry','إدخال'],['set','الإعدادات']]:[['entry','مبيعاتي']];
  const fsel=`<div class="row" style="margin-bottom:10px"><div class="f"><label>الشهر</label><input type="month" value="${month}" onchange="month=this.value||month;sub()"></div>
  ${tab==='day'?`<div class="f"><label>الفرع</label><select onchange="fb=this.value;render()"><option value="all">كل الفروع</option>${cfg.branches.map(b=>`<option value="${b.id}" ${fb===b.id?'selected':''}>${b.name}</option>`).join('')}</select></div>`:''}</div>`;
  const body=tab==='tot'?total():tab==='sum'?summary():tab==='day'?daily(fb):tab==='set'?settings():entry();
  $('#app').className='';
  $('#app').innerHTML=`<div class="tabs">${T.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}</div>${tab==='set'||(tab==='entry'&&!isAdmin)?'':fsel}${body}`;
}
</script>
</body>
</html>
