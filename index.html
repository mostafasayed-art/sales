<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09253C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ovio Sales</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09253C;--card:#0f3350;--card2:#0b2d47;--bd:#1f4c6e;--tx:#eaeef4;--mut:#8fa8bd;--pri:#eaeef4;--on:#09253C;--ok:#5fd3a6;--bad:#ff8f8f;--warn:#f2c46d;--acc:#7fb4d9;--gold:#f2c46d;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;font-size:15px;max-width:960px;margin-inline:auto;padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
.top img{height:46px;width:auto;display:block}
.top .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}.tabs button{flex:0 0 auto}
button,select,input{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
input,select{width:100%}
input::placeholder{color:var(--mut)}
.f{flex:1 1 120px}.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
button{cursor:pointer}button.p,.tabs button.on{background:var(--pri);color:var(--on);border-color:var(--pri);font-weight:700}
.sm{padding:4px 8px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 0;border-bottom:1px dashed var(--bd)}.kv:last-child{border:0}
.mut{color:var(--mut);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--acc)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:13px}
th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--bd)}th{background:var(--card2)}tfoot td{font-weight:700}
.login{max-width:380px;margin:6vh auto 0;text-align:center}.login img{height:90px;margin-bottom:10px}.login .f{text-align:start}
.chart{direction:ltr}.chart svg{width:100%;height:auto;display:block}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:4px;vertical-align:middle}
.br{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.trk{position:relative;height:14px;background:var(--bd);border-radius:7px}.trk .fl{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:7px}.trk .pj{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--gold);border-radius:2px}
.stk{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--bd);margin:8px 0}
</style>
</head>
<body>
<div class="top"><img src="logo.png" alt="Ovio"><div class="who"><span id="role"></span><button class="sm" id="out" style="display:none" onclick="auth.signOut()">خروج</button></div></div>
<div id="app" class="mut">جاري التحميل…</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== الصق إعدادات مشروع Firebase هنا =====
const FIREBASE_CONFIG={apiKey:"AIzaSyBAt_e-2Jrrnp6wZMm_WgxnVaR0fJikelc",authDomain:"ovio-sales.firebaseapp.com",projectId:"ovio-sales",appId:"1:798015614049:web:70dcac4aca12f734808e20"};
// ==========================================
const $=s=>document.querySelector(s);
const N=(x,d=0)=>Number(x||0).toLocaleString('en-US',{maximumFractionDigits:d});
const P=x=>isFinite(x)?N(x,1)+'%':'—';
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const today=()=>{const d=new Date();return ym(d)+'-'+String(d.getDate()).padStart(2,'0')};
firebase.initializeApp(FIREBASE_CONFIG);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
const auth=firebase.auth(),db=firebase.firestore();
try{db.settings({experimentalAutoDetectLongPolling:true,merge:true})}catch(e){}
const AP=firebase.auth.Auth.Persistence;
auth.setPersistence(AP.LOCAL).catch(()=>auth.setPersistence(AP.SESSION)).catch(()=>auth.setPersistence(AP.NONE)).catch(()=>{});
let authDone=false;
function slow(){$('#app').className='';$('#app').innerHTML=`<div class="card login"><h2>التحميل واخد وقت طويل</h2><p class="mut" style="text-align:start">غالبًا السبب الشبكة أو المتصفح:</p><div class="kv"><span style="text-align:start">• افتح اللينك من Chrome أو Safari مباشرة، مش من جوه واتساب أو فيسبوك.</span></div><div class="kv"><span style="text-align:start">• غيّر الشبكة (واي فاي / بيانات الموبايل) واقفل أي VPN.</span></div><div class="kv"><span style="text-align:start">• اقفل الصفحة تمامًا وافتحها تاني.</span></div><div class="row" style="margin-top:12px;justify-content:center"><button class="p" onclick="location.reload()">إعادة المحاولة</button><button onclick="auth.signOut().finally(()=>location.reload())">تسجيل خروج</button></div></div>`}
setTimeout(()=>{if(!authDone)slow()},10000);
let me=null,isAdmin=false,cfg={branches:[],targets:{}},rows=[],users=[],month=ym(new Date()),tab='sum',fb='all',unsubs=[],unsubS,grp='ovio',yr=new Date().getFullYear(),yd=[],yLoaded=0,yLoad=false,cmpA=null,cmpB=null;
const AR={'auth/invalid-credential':'الإيميل أو الباسورد غلط','auth/wrong-password':'الباسورد غلط','auth/user-not-found':'الحساب غير موجود','auth/email-already-in-use':'الإيميل مستخدم قبل كده','auth/weak-password':'الباسورد ضعيف (6 أحرف على الأقل)','auth/too-many-requests':'محاولات كتير، جرّب بعد شوية'};
const err=e=>alert(AR[e.code]||('حصل خطأ: '+(e.message||e)));

auth.onAuthStateChanged(async u=>{
  authDone=true;
  unsubs.forEach(f=>f());unsubs=[];if(unsubS)unsubS();
  $('#out').style.display=u?'':'none';
  if(!u){me=null;login();return}
  setTimeout(()=>{if(!me&&auth.currentUser)slow()},12000);
  try{
    const s=await db.doc('users/'+u.uid).get();
    if(!s.exists){$('#app').innerHTML='<div class="card">حسابك مش متفعّل. كلم الأدمن.</div>';return}
    me={uid:u.uid,...s.data()};isAdmin=me.role==='admin';tab=isAdmin?'tot':(userTabs()[0]||['entry'])[0];
    $('#role').textContent=isAdmin?'(أدمن)':'(يوزر)';
    unsubs.push(db.doc('config/main').onSnapshot(d=>{if(d.exists)cfg=Object.assign({branches:[],targets:{}},d.data());render()}));
    if(isAdmin)unsubs.push(db.collection('users').onSnapshot(q=>{users=q.docs.map(d=>({uid:d.id,...d.data()}));if(tab==='set')render()}));
    if(isAdmin)unsubs.push(db.collection('headcount').onSnapshot(q=>{hcErr='';q.docChanges().forEach(ch=>{if(ch.type==='removed')delete hc[ch.doc.id];else hc[ch.doc.id]=ch.doc.data()});if(tab==='hc')render()},e=>{hcErr=e.message||'error';if(tab==='hc')render()}));
    else if(can('hc'))myB().forEach(bid=>unsubs.push(db.doc('headcount/'+bid).onSnapshot(d=>{hcErr='';if(d.exists)hc[bid]=d.data();else delete hc[bid];if(tab==='hc')render()},e=>{hcErr=e.message||'error';if(tab==='hc')render()})));
    sub();
  }catch(e){$('#app').textContent='تعذر التحميل: '+e.message}
});
function login(){
  $('#role').textContent='';
  $('#app').innerHTML=`<div class="card login"><img src="logo.png" alt="Ovio"><h2>تسجيل الدخول</h2>
  <div class="f"><label>الإيميل</label><input id="le" type="email" autocomplete="username"></div>
  <div class="f" style="margin-top:8px"><label>الباسورد</label><input id="lp" type="password" autocomplete="current-password"></div>
  <div class="row" style="margin-top:12px;justify-content:center"><button class="p" id="lb" onclick="doLogin()">دخول</button><button class="sm" onclick="forgot()">نسيت الباسورد</button></div></div>`;
}
function doLogin(){
  const b=$('#lb');b.disabled=true;b.textContent='جاري الدخول…';
  const t=setTimeout(()=>{b.disabled=false;b.textContent='دخول';alert('الدخول واخد وقت طويل. افتح اللينك من Chrome أو Safari مباشرة (مش من واتساب) أو غيّر الشبكة وجرّب تاني.')},15000);
  auth.signInWithEmailAndPassword($('#le').value.trim(),$('#lp').value).catch(err).finally(()=>{clearTimeout(t);b.disabled=false;b.textContent='دخول'})
}
const forgot=()=>{const e=$('#le').value.trim();if(!e){alert('اكتب الإيميل الأول');return}auth.sendPasswordResetEmail(e).then(()=>alert('اتبعتلك لينك تغيير الباسورد على الإيميل')).catch(err)};
let unsubS2=[],rowsB={},salesErr='';
function sub(){
  if(unsubS)unsubS();unsubS2.forEach(f=>f());unsubS2=[];rowsB={};
  if(isAdmin){unsubS=db.collection('sales').where('month','==',month).onSnapshot(s=>{rows=s.docs.map(d=>d.data());render()},e=>{$('#app').textContent='تعذر قراءة المبيعات'});return}
  if(!can('sv')||!myB().length){rows=[];render();return}
  myB().forEach(bid=>unsubS2.push(db.collection('sales').where('branch','==',bid).where('month','==',month).onSnapshot(s=>{salesErr='';rowsB[bid]=s.docs.map(d=>d.data());rows=[].concat(...Object.values(rowsB));render()},e=>{salesErr=e.message||'error';render()})))
}
const saveCfg=()=>db.doc('config/main').set(cfg).catch(err);
const GN={ovio:'Ovio',little:'Little Ovio'};
const myB=()=>me&&Array.isArray(me.branches)?me.branches:(me&&me.branch?[me.branch]:[]);
const can=p=>isAdmin||!me||!Array.isArray(me.perms)||me.perms.includes(p);
const gb=()=>isAdmin?cfg.branches.filter(b=>(b.group||'ovio')===grp):cfg.branches.filter(b=>myB().includes(b.id));
const gtitle=()=>isAdmin?GN[grp]:'فروعك';
const gset=()=>new Set(gb().map(b=>b.id));
const bFull=b=>GN[b.group||'ovio']+' · '+b.name;
const bName=id=>(cfg.branches.find(b=>b.id===id)||{name:'؟'}).name;
const dim=()=>{const[y,m]=month.split('-').map(Number);return new Date(y,m,0).getDate()};
const tgt=b=>{const t=cfg.targets[month]||{};return b==='all'?gb().reduce((a,x)=>a+(+t[x.id]||0),0):(+t[b]||0)};
const CH=['dine','take','del','cat'],CL={dine:'Dine in',take:'Take away',del:'Delivery',cat:'Catering'};
function cutDay(){const t=today(),cm=t.slice(0,7),D=dim();return month<cm?D:month>cm?0:Math.min(D,+t.slice(8))}
function calc(b){
  const G=gset(),r=rows.filter(x=>b==='all'?G.has(x.branch):x.branch===b),D=dim(),T=tgt(b),by={};
  const ch={};CH.forEach(k=>ch[k]={s:0,n:0});
  let S=0,I=0;
  r.forEach(x=>{CH.forEach(k=>{if(x[k]){ch[k].s+=x[k].s||0;ch[k].n+=x[k].n||0}});if(x.monthly){S+=x.sales;I+=x.invoices;return}const d=+x.date.slice(8);(by[d]=by[d]||{s:0,i:0,n:0});by[d].s+=x.sales;by[d].i+=x.invoices});
  const days=Object.keys(by).map(Number),last=days.length?Math.max(...days):0;
  days.forEach(d=>{S+=by[d].s;I+=by[d].i});
  const avg=last?S/last:(S?S/D:0),proj=last?avg*D:S;
  const cut=cutDay(),Tc=T?T*cut/D:0;let Sc=S;days.forEach(d=>{if(d>cut)Sc-=by[d].s});
  return{by,last,S,I,T,D,avg,proj,pct:T?S/T*100:NaN,pp:T?proj/T*100:NaN,ticket:I?S/I:0,ch,cut,Sc,Tc,def:Tc-Sc}
}
const cls=p=>!isFinite(p)?'':p>=100?'ok':p>=80?'warn':'bad';
function card(name,c){
  const w=Math.min(100,isFinite(c.pct)?c.pct:0);
  return `<div class="card"><h2>${name}</h2>
  <div class="kv"><span>المبيعات حتى الآن</span><b>${N(c.S)}</b></div>
  <div class="kv"><span>التارجت الشهري</span><b>${c.T?N(c.T):'—'}</b></div>
  <div class="kv"><span>المحقق من التارجت</span><b class="${cls(c.pct)}">${P(c.pct)}</b></div>
  <div class="bar"><i style="width:${w}%"></i></div>
  ${c.T&&c.cut?`<div class="kv"><span>تارجت لحد اليوم (${c.cut} يوم من ${c.D})</span><b>${N(c.Tc)}</b></div><div class="kv"><span>${c.def>0?'العجز عن التارجت لحد اليوم':'الزيادة عن التارجت لحد اليوم'}</span><b class="${c.def>0?'bad':'ok'}">${N(Math.abs(c.def))} <span class="mut">(${N(Math.abs(c.def)/c.Tc*100,1)}%)</span></b></div>`:''}
  <div class="kv"><span>عدد الفواتير</span><b>${N(c.I)}</b></div>
  <div class="kv"><span>متوسط الفاتورة</span><b>${N(c.ticket,1)}</b></div>
  ${CH.map(k=>`<div class="kv"><span>${CL[k]}</span><span>${N(c.ch[k].s)} <span class="mut">(${c.S?N(c.ch[k].s/c.S*100,1):0}%) · ${N(c.ch[k].n)} فاتورة</span></span></div>`).join('')}
  <div class="kv"><span>متوسط المبيعات اليومي</span><b>${N(c.avg)}</b></div>
  <div class="kv"><span>🔮 المتوقع آخر الشهر</span><b>${N(c.proj)}</b></div>
  <div class="kv"><span>المتوقع من التارجت</span><b class="${cls(c.pp)}">${P(c.pp)}</b></div>
  <div class="kv"><span>${c.proj>=c.T?'زيادة متوقعة':'عجز متوقع'}</span><b class="${c.proj>=c.T?'ok':'bad'}">${c.T?N(Math.abs(c.proj-c.T)):'—'}</b></div></div>`
}

const K=n=>{n=Math.abs(n)>=1e6?N(n/1e6,1)+'M':Math.abs(n)>=1e3?N(n/1e3,1)+'K':N(n);return n};
function chartDaily(c){
  const W=640,H=230,L=44,R=10,T=14,B=26,D=c.D,dt=c.T?c.T/D:0;
  let mx=dt;for(let d=1;d<=D;d++)mx=Math.max(mx,(c.by[d]||{s:0}).s);mx=(mx||1)*1.15;
  const x=d=>L+(d-.5)*(W-L-R)/D,y=v=>T+(H-T-B)*(1-v/mx),bw=Math.max(2,(W-L-R)/D*.62);
  let g='';for(let i=0;i<=3;i++){const v=mx*i/3;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#1f4c6e" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#8fa8bd">${K(v)}</text>`}
  let bars='';for(let d=1;d<=D;d++){const v=(c.by[d]||{s:0}).s;if(v>0)bars+=`<rect x="${x(d)-bw/2}" y="${y(v)}" width="${bw}" height="${H-B-y(v)}" rx="2" fill="${dt&&v<dt?'#7fb4d9':'#5fd3a6'}"/>`}
  let xt='';for(let d=1;d<=D;d++)if(d===1||d%5===0||d===D)xt+=`<text x="${x(d)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#8fa8bd">${d}</text>`;
  const tl=dt?`<line x1="${L}" x2="${W-R}" y1="${y(dt)}" y2="${y(dt)}" stroke="#f2c46d" stroke-width="2" stroke-dasharray="6 4"/>`:'';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}${bars}${tl}${xt}</svg></div><div class="lg"><span><i style="background:#5fd3a6"></i>أعلى من تارجت اليوم</span><span><i style="background:#7fb4d9"></i>أقل من التارجت</span><span><i style="background:#f2c46d"></i>تارجت اليوم</span></div>`
}
function chartCum(c){
  const W=640,H=230,L=44,R=10,T=14,B=26,D=c.D,mx=(Math.max(c.T,c.proj,c.S)||1)*1.1;
  const x=d=>L+(d-1)*(W-L-R)/Math.max(D-1,1),y=v=>T+(H-T-B)*(1-v/mx);
  let g='';for(let i=0;i<=3;i++){const v=mx*i/3;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#1f4c6e"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#8fa8bd">${K(v)}</text>`}
  let pts=[],cs=0;for(let d=1;d<=c.last;d++){cs+=(c.by[d]||{s:0}).s;pts.push(`${x(d)},${y(cs)}`)}
  let xt='';for(let d=1;d<=D;d++)if(d===1||d%5===0||d===D)xt+=`<text x="${x(d)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#8fa8bd">${d}</text>`;
  const tl=c.T?`<line x1="${x(1)}" y1="${y(c.T/D)}" x2="${x(D)}" y2="${y(c.T)}" stroke="#f2c46d" stroke-width="2" stroke-dasharray="6 4"/>`:'';
  const pj=c.last&&c.last<D?`<line x1="${x(c.last)}" y1="${y(c.S)}" x2="${x(D)}" y2="${y(c.proj)}" stroke="#eaeef4" stroke-width="2" stroke-dasharray="2 4"/><circle cx="${x(D)}" cy="${y(c.proj)}" r="4" fill="#eaeef4"/>`:'';
  const ac=pts.length?`<polyline points="${pts.join(' ')}" fill="none" stroke="#5fd3a6" stroke-width="3" stroke-linejoin="round"/>`:'';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}${tl}${ac}${pj}${xt}</svg></div><div class="lg"><span><i style="background:#5fd3a6"></i>الفعلي التراكمي</span><span><i style="background:#f2c46d"></i>التارجت التراكمي</span><span><i style="background:#eaeef4"></i>التوقع لآخر الشهر</span></div>`
}
function chartBranches(){
  const rows=gb().map(b=>({n:b.name,c:calc(b.id)}));
  if(!rows.length)return '<span class="mut">أضف فروع</span>';
  const mx=Math.max(130,...rows.map(r=>Math.max(isFinite(r.c.pct)?r.c.pct:0,isFinite(r.c.pp)?r.c.pp:0)))*1.02;
  return rows.map(r=>{const a=isFinite(r.c.pct)?r.c.pct:0,p=isFinite(r.c.pp)?r.c.pp:0;
    return `<div class="br"><span>${r.n}</span><div><div class="trk"><div class="fl" style="width:${Math.min(a/mx*100,100)}%"></div>${r.c.T?`<div class="pj" style="left:${Math.min(p/mx*100,100)}%"></div>`:''}</div><div class="mut" style="margin-top:3px">المحقق ${P(r.c.pct)} · المتوقع <span class="${cls(r.c.pp)}">${P(r.c.pp)}</span> · ${N(r.c.S)}</div></div></div>`}).join('')+`<div class="lg"><span><i style="background:#7fb4d9"></i>المحقق حتى الآن</span><span><i style="background:#f2c46d"></i>المتوقع آخر الشهر</span></div>`
}
function chartChannels(c){
  const col={dine:'#7fb4d9',take:'#5fd3a6',del:'#f2c46d',cat:'#c9a7ff'},tot=CH.reduce((a,k)=>a+c.ch[k].s,0);
  if(!tot)return '<span class="mut">لا توجد بيانات قنوات بعد</span>';
  return `<div class="stk">${CH.map(k=>`<div style="width:${c.ch[k].s/tot*100}%;background:${col[k]}"></div>`).join('')}</div>`+CH.map(k=>`<div class="kv"><span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${col[k]};margin-inline-end:6px"></i>${CL[k]}</span><span>${N(c.ch[k].s)} <span class="mut">(${N(c.ch[k].s/tot*100,1)}%) · ${N(c.ch[k].n)} فاتورة</span></span></div>`).join('')
}
function total(){

    return{title:`عجز التارجت ومقارنات ${g} — ${yr}`,file:`target-gap-${grp}-${yr}`,sheets:[{name:'عجز التارجت الشهري',rows:ms},{name:'عجز التارجت بالفرع',rows:bs},rawSheet(gRows(yd))]}}
  if(tab==='hc')return hcExp();
  return null
}
function csvOut(file,sheets){
  const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const t=sheets.map(s=>s.name+'\r\n'+s.rows.map(r=>r.map(q).join(',')).join('\r\n')).join('\r\n\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv;charset=utf-8'}));a.download=file+'.csv';a.click();
  alert('مكتبة Excel ما اتحملتش فنزّلت ملف CSV بدل xlsx (بيتفتح في Excel عادي).')
}
async function xlsxOut(file,sheets){
  try{await loadXLSX();const wb=XLSX.utils.book_new();
    sheets.forEach(s=>{const ws=XLSX.utils.aoa_to_sheet(s.rows);ws['!cols']=s.rows[0].map((_,i)=>({wch:Math.min(40,s.rows.reduce((m,r)=>Math.max(m,String(r[i]==null?'':r[i]).length),8))}));XLSX.utils.book_append_sheet(wb,ws,s.name.slice(0,31))});
    XLSX.writeFile(wb,file.replace(/[\\/:*?"<>|]/g,'-')+'.xlsx')}
  catch(e){csvOut(file,sheets)}
}
function pdfPrint(title,sheets){
  const f2=v=>typeof v==='number'?(Number.isInteger(v)?N(v):N(v,2)):hesc(v==null?'':v);
  const tbl=s=>`<h2>${hesc(s.name)}</h2><table><thead><tr>${s.rows[0].map(h=>`<th>${hesc(h)}</th>`).join('')}</tr></thead><tbody>${s.rows.slice(1).map(r=>`<tr${r[0]==='الإجمالي'?' style="font-weight:700"':''}>${r.map(v=>`<td>${f2(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  const html=`<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>${hesc(title)}</title><style>@page{size:A4 landscape;margin:10mm}body{font-family:Cairo,Tahoma,Arial,sans-serif;color:#111;margin:0}h1{font-size:18px;margin:0 0 4px}.m{color:#666;font-size:11px;margin-bottom:10px}h2{font-size:14px;margin:16px 0 6px}table{border-collapse:collapse;width:100%;font-size:11px}th,td{border:1px solid #bbb;padding:4px 6px;text-align:center}th{background:#e9edf2}tr:nth-child(even) td{background:#fafafa}thead{display:table-header-group}tr{page-break-inside:avoid}</style></head><body><h1>Ovio — ${hesc(title)}</h1><div class="m">${new Date().toLocaleString('en-GB')}</div>${sheets.map(tbl).join('')}</body></html>`;
  const f=document.createElement('iframe');f.style.cssText='position:fixed;width:0;height:0;border:0;right:0;bottom:0';document.body.appendChild(f);
  const w=f.contentWindow,d=w.document;d.open();d.write(html);d.close();
  setTimeout(()=>{w.focus();w.print()},350);setTimeout(()=>f.remove(),180000)
}
async function expX(kind){
  const r=expData();if(!r)return;
  if(kind==='pdf')pdfPrint(r.title,r.sheets.filter(s=>!s.noPdf));else await xlsxOut(r.file,r.sheets)
}
const PERMS=[['sv','يشوف المبيعات'],['se','يدخل المبيعات'],['hc','يشوف Headcount']];
let uedit=null;
function userTabs(){const t=[];if(can('sv')){if(myB().length>1)t.push(['tot','الإجمالي']);t.push(['sum','الفروع'],['day','يوم بيوم'])}if(can('se'))t.push(['entry','إدخال']);if(can('hc'))t.push(['hc','Headcount']);return t}
function permBox(id,u){
  const pm=u?(Array.isArray(u.perms)?u.perms:['sv','se','hc']):['sv'],br=u?(Array.isArray(u.branches)?u.branches:(u.branch?[u.branch]:[])):[];
  const L='display:flex;gap:8px;align-items:center;font-size:14px;color:var(--tx)';
  return `<div class="f" style="margin-top:8px"><label>اليوزر يقدر يعمل إيه</label>${PERMS.map(([k,l])=>`<label style="${L}"><input type="checkbox" id="pm_${id}_${k}" style="width:auto" ${pm.includes(k)?'checked':''}>${l}</label>`).join('')}</div>
  <div class="f" style="margin-top:8px"><label>الفروع اللي يشوفها (ممكن أكتر من فرع)</label>${cfg.branches.map(b=>`<label style="${L}"><input type="checkbox" id="bc_${id}_${b.id}" style="width:auto" ${br.includes(b.id)?'checked':''}>${bFull(b)}</label>`).join('')}</div>`
}
const readPerm=id=>({perms:PERMS.map(p=>p[0]).filter(k=>$('#pm_'+id+'_'+k).checked),branches:cfg.branches.map(b=>b.id).filter(i=>$('#bc_'+id+'_'+i).checked)});
const uSum=u=>{if(u.role==='admin')return 'أدمن (كل حاجة)';const pm=(Array.isArray(u.perms)?u.perms:['sv','se','hc']).map(k=>(PERMS.find(p=>p[0]===k)||[0,k])[1]).join(' · ')||'بدون صلاحيات',br=(Array.isArray(u.branches)?u.branches:(u.branch?[u.branch]:[])).map(bName).join('، ')||'بدون فروع';return pm+' — '+br};
function saveU(id){
  const role=$('#ured').value,{perms,branches}=readPerm('e');
  if(role==='user'&&(!perms.length||!branches.length)){alert('اختار صلاحية واحدة على الأقل وفرع واحد على الأقل');return}
  if(id===me.uid&&role!=='admin'&&!confirm('هتشيل صلاحية الأدمن من حسابك. متأكد؟'))return;
  uedit=null;updU(id,{role,perms:role==='user'?perms:[],branches:role==='user'?branches:[],branch:role==='user'?branches[0]:''})
}
function render(){
  if(!me)return;
  if(document.activeElement&&/^(s_|n_|nb|un|ue|up|ei|q_|h|pm_|bc_)/.test(document.activeElement.id))return;
  if(isAdmin&&tab==='ana'&&yLoaded!==yr&&!yLoad){loadY();return}
  const T=isAdmin?[['tot','الإجمالي'],['sum','الفروع'],['day','يوم بيوم'],['ana','مقارنات وتحليل'],['hc','Headcount'],['entry','إدخال'],['set','الإعدادات']]:userTabs();
  if(!isAdmin){if(!T.length){$('#app').innerHTML='<div class="card">حسابك لسه مالوش صلاحيات. كلم الأدمن.</div>';return}if(!T.some(x=>x[0]===tab))tab=T[0][0]}
  const gsw=isAdmin?`<div class="tabs">${Object.keys(GN).map(g=>`<button class="${grp===g?'on':''}" onclick="grp='${g}';fb='all';render()">${GN[g]}</button>`).join('')}</div>`:'';
  const fsel=`<div class="row" style="margin-bottom:10px"><div class="f"><label>الشهر</label><input type="month" value="${month}" onchange="month=this.value||month;sub()"></div>
  ${tab==='day'?`<div class="f"><label>الفرع</label><select onchange="fb=this.value;render()"><option value="all">كل الفروع</option>${gb().map(b=>`<option value="${b.id}" ${fb===b.id?'selected':''}>${b.name}</option>`).join('')}</select></div>`:''}</div>`;
  const cy=new Date().getFullYear(),ysel=`<div class="row" style="margin-bottom:10px"><div class="f"><label>السنة</label><select onchange="yr=+this.value;yLoaded=0;loadY()">${[0,1,2,3,4].map(i=>cy-i).map(y=>`<option ${y===yr?'selected':''}>${y}</option>`).join('')}</select></div><div class="f"><label>&nbsp;</label><button onclick="yLoaded=0;loadY()">تحديث البيانات</button></div></div>`;
  const expBar=(isAdmin?['tot','sum','day','ana','hc']:['tot','sum','day','hc']).includes(tab)?`<div class="row" style="margin-bottom:10px;justify-content:flex-end"><button class="sm" onclick="expX('xlsx')">⬇ Excel</button>${false?'':'<button class="sm" onclick="expX(\'pdf\')">⬇ PDF</button>'}</div>`:'';
  const sNote=!isAdmin&&salesErr&&tab!=='hc'?`<div class="card"><b class="bad">مش قادر أقرأ المبيعات.</b><p class="mut">${hesc(salesErr)}</p></div>`:'';
  const body=tab==='hc'?hcView():tab==='tot'?total():tab==='sum'?summary():tab==='day'?daily(fb):tab==='ana'?analysis():tab==='set'?settings():entry();
  $('#app').className='';
  $('#app').innerHTML=`${gsw}<div class="tabs">${T.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}</div>${sNote}${expBar}${tab==='hc'?'':tab==='ana'?ysel:(tab==='entry'&&!isAdmin?'':fsel)}${body}`;
}
